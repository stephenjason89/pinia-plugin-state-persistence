name: Quality checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck package
        run: bun run typecheck

      - name: Check consumer types
        run: bun run test:types

      - name: Test
        run: bun run test

      - name: Build ESM and CommonJS
        run: bun run build

      - name: Build documentation
        run: bun run docs:build
